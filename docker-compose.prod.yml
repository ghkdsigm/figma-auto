services:
  # Reverse proxy (no domain; serve over http://<server-ip>)
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company_pw
      POSTGRES_DB: a2ui_codegen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d a2ui_codegen"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  toolserver:
    build: { context: ./toolserver }
    environment:
      FIGMA_TOKEN: ${FIGMA_TOKEN}
      FIGMA_API_BASE: ${FIGMA_API_BASE:-https://api.figma.com}
      PORT: 4010

  api:
    build: { context: ./backend }
    env_file: [./.env]
    environment:
      # Ensure container-to-container routing (default localhost would break in Docker)
      TOOLSERVER_URL: ${TOOLSERVER_URL:-http://toolserver:4010}
      # Prisma expects DATABASE_URL; default points to the compose postgres service
      DATABASE_URL: ${DATABASE_URL:-postgresql://company:company_pw@postgres:5432/a2ui_codegen}
      # Redis for BullMQ
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # Uploads/artifacts directory inside container
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/artifacts}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      toolserver: { condition: service_started }
    volumes:
      - artifacts:/data/artifacts

  web:
    build: { context: ./web }
    environment:
      # Browser must call the same origin; Caddy will proxy /api/* -> api:3000
      NUXT_PUBLIC_API_BASE: "/api"
      PORT: 3001
      HOST: 0.0.0.0
      NITRO_PORT: 3001
      NITRO_HOST: 0.0.0.0
    depends_on:
      - api

volumes:
  pgdata:
  artifacts:
  caddy_data:
  caddy_config:


